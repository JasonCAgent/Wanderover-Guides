  moments: {"Pre-arrival": {"tagline": "Let's get you ready for Mesa!", "topics": ["Welcome", "Add This Guide To Your Phone", "Driving Directions", "Things To Bring", "Overview of the Area", "Contacting Us"]}, "Check-in": {"tagline": "Welcome! Here's how to get settled.", "topics": ["Access Codes / Instructions", "Check-in Time", "Suggestions if you arrive early", "WiFi / Internet Details", "Heating & Cooling", "Quiet Times", "What to do in an Emergency"]}, "During your stay": {"tagline": "Make the most of your stay.", "topics": ["WiFi / Internet Details", "Pool & Spa", "Fireplace", "Television", "Grill / BBQ", "Emergency Phone Numbers"]}, "Check-out": {"tagline": "Everything for an easy check-out.", "topics": ["Check-out Time", "Check-out Process", "Thank You For Staying With Us"]}},

  sections: [
    { title: "👋 Welcome", topics: [
      { t: "Welcome", d: `<p><strong>Welcome: Your Inside Track</strong></p><p>This is your time. And your time is precious. That's why we've created this guidebook. You'll find everything you need to know about staying with us, from check-in time to the WiFi code, great coffee to the best local restaurants. It's all here.</p><p><strong>Do I really need this info?</strong> Honest answer? 100% YES! Think of it like having us "virtually" by your side, showing you:</p><ul><li>How to find us 📍</li><li>The WiFi code 📶</li><li>Check-in instructions 🔑</li><li>Discovering wonderful local places 🎢</li><li>Excellent restaurants 🍽</li><li>How to find eternal happiness 🥰</li></ul><p>Well maybe not that last one, but hopefully you will leave us relaxed, content, and rejuvenated!</p><p>If you'd like a PDF of this guide, tap <strong>🖨 Print</strong> at the top and choose "Save as PDF".</p><p><strong>What next?</strong> Please relax, unwind, have fun, and enjoy your stay!</p>` }
    ]},
    { title: "🧳 Before You Leave Home", topics: [
      { t: "Add This Guide To Your Phone", d: `<p>Add this guide to your home screen so it opens like an app 📲, no download or sign-in needed.</p><ul><li><strong>iPhone:</strong> open this link in Safari, tap the Share button, then "Add to Home Screen".</li><li><strong>Android:</strong> open in Chrome, tap the ⋮ menu, then "Add to Home screen".</li></ul><p><strong>Share your guide with your group.</strong> Send this link to everyone travelling with you so everyone has the info (less hassle for the trip organizer!).</p>` },
      { t: "Driving Directions", d: `<p>Tap <strong>Get directions</strong> on the Home tab. It opens Google Maps with the house already filled in as your destination. 📍</p>` },
      { t: "Things To Bring", d: `<p>Here's a basic list of what you might want to bring on your vacation. You'll no doubt have your own needs, but we thought this might be helpful, knowing what we do about the amenities in this home!</p><ul><li>Personal toiletries 🪥</li><li>Camera, memory cards, charger 📸</li><li>Personal electronics chargers 🔌</li><li>Flashlights, batteries 🔦🔋</li><li>Hiking gear 🥾</li><li>Sunscreen, and depending on the time of year, perhaps an umbrella ☂️</li></ul>` }
    ]},
    { title: "🔑 Arrival Information", topics: [
      { t: "Access Codes / Instructions", d: `<p>We will provide you with an access key code 24 hours prior to arrival. This will allow you to check yourself in to the property. <strong>Please ensure you have the code before you travel. If not, please contact us.</strong> There's nothing worse than arriving somewhere new (potentially at night) and not being able to get in! </p>` },
      { t: "Check-in Time", d: `<p>Check-in time is 4️⃣PM. If you are arriving early, look at the Local guide tab. We've listed many things to do around the area - it's time for you to kick back and start relaxing!</p>` },
      { t: "Contacting Us", d: `<p>If you booked on <a href="https://www.airbnb.com" target="_blank" rel="noopener">Airbnb</a> or <a href="https://www.vrbo.com" target="_blank" rel="noopener">VRBO</a>, we prefer all communication goes through their app. If you booked directly with us, please phone, text or email:</p><ul><li><a href="sms:4807803512">Text us at (480) 780-3512</a> 💬 (fastest: Alison, Jason and our assistant all see it)</li><li><a href="tel:6024325367">Call (602) 432-5367</a> ☎️</li><li><a href="mailto:MyVacation@WanderOver.com">Email MyVacation@WanderOver.com</a> 📧</li></ul>` },
      { t: "Overview of the Area", d: `<p>You will be staying in Mesa, a very long (East and West) city bordering Gilbert, Chandler, Apache Junction, and Queen Creek, in the surrounding Phoenix area.</p><p>🥾There is hiking available in places like Brown Mountain, Merkel Trail, and in the Usery Mountain Regional Park, all very near by. Some of the best hiking in the area is in Apache Junction at the famous Superstition Mountains. Let us know if you find the Lost Dutchman’s gold hidden there! </p><p>⚽️ Legacy Sports Complex / Ball Bank Park - 12 miles (18 minutes) </p><p>🍔 Downtown Mesa - 19 miles (24 minutes)</p><p>🍸 Downtown Gilbert - 15 miles (22 minutes)</p><p>🍻 Old Town Scottsdale - 25 miles (30 minutes) </p><p>✈️ Phoenix-Mesa Gateway Airport - 13 miles (21 minute drive)</p><p>✈️ Phoenix Sky Harbor Airport - 24 miles (24 minute drive)</p>` },
      { t: "Suggestions if you arrive early", d: `<p>Many guests will arrive before the designated check-in time of 4 pm. The good news is that there is plenty to do. We often suggest that guests visit the grocery store (Fry's is just 3.2 miles away) or visit downtown Mesa or Downtown Gilbert for nearly unlimited dining experiences, or head to the Superstition Springs Mall area minutes away for tons of shopping, more dining, or golf at Top Golf or try Bowling or putt-putt golf at Main Event (both in Gilbert). That will give you more time to relax once you've checked in! </p>` }
    ]},
    { title: "🏡 About the Accommodation", topics: [
      { t: "Heating & Cooling", d: `<p>You will find a panel on the living room wall that allows you to control the temperature in the living room. Annnnd there are six more throughout the home (one in each bedroom). If you're running the air conditioning, please ensure that all windows and outside doors are closed to ensure it operate to maximum efficiency. We recommend a setting of 72F / 22C which we find keeps the place at a comfortable temperature. IF you adjust up or down, <em>PLEASE</em> only adjust a max of 3 degrees at a time as to not damage the equipment. </p>` },
      { t: "Fireplace", d: `<p>Our home has a working gas fireplace. Please take extra care when using the fireplace. The fireplace is more for ambience than heat, as we do have central heating in the property for your ultimate comfort. </p>` },
      { t: "Game room heating & cooling", d: `<p>There are two mini-split heating and air conditioning units on the wall in the game room / garage. There is a remote mounted on the wall below each unit. Please use this remote to operate, but please do not remove the remote from the room. Please return it to the holster on the wall if removed. </p>` },
      { t: "Kitchen equipment", d: `<p>The Dishwasher: It's very simple, we promise! We provide a supply of tablets - you will need to insert one into the flip box container on the inside of the dishwasher door. Then press the program button of your choice - there are a few settings which are obvious - then press the start button. <br><br>The Fridge/freezer: You should not need to adjust any settings. If you run into any difficulties (e.g. it's not cooling efficiently) please let us know. <br><br>The Oven/Range: No special instructions, the property does have a gas range, so PLEASE be sure to turn off completely and monitor children around the knobs and/or flames. </p>` },
      { t: "Laundry appliances", d: `<p>We have a washer and separate dryer located in the utility room inside the home. There is a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in the tray, close the door, and hit start. </p>` },
      { t: "Air Hockey", d: `<p>There is a professional air hockey table available for hours of fun, located inside the game room. When entering the game room, you'll find a switch on the wall to the right.</p>` },
      { t: "Television", d: `<p>There is a television available in each bedroom, as well as the living room, game room, and outside patio. Each has a dedicated remote. Press power on the remote to turn on the TV. If you'd like to watch popular streaming apps like Netflix or Hulu, navigate to the Netflix or Hulu apps and sign in to your personal accounts to stream your favorite shows and movies. <strong><em>Remember to sign out</em></strong> of your streaming services before you conclude your stay. </p>` },
      { t: "Grill / BBQ", d: `<p>There is an outdoor grill available for your use. It's powered by natural gas. Please ensure you leave it clean to avoid any additional cleaning fees.</p>` },
      { t: "Pool & Spa", d: `<p>Sunset Palms has an awesome sparkling swimming pool for splashing in the Summer heat. It can be heated during Fall / Summer / Spring for only $150/day (please ask us to heat it no less than 24 hours in advance so we can get on it.) </p><p>The spa can be heated on demand to a warm 100-104 for your hot tub pleasure. </p>` }
    ]},
    { title: "📋 Safety Info & Rules", topics: [
      { t: "Quiet Times", d: `<p>We are located in a residential community and, although this is a vacation destination, it's home to many people. As such we ask that you respect their privacy and their right to a peaceful existence. Specifically, between the hours of 10pm and 7am noise should be kept to a minimum. 🤫</p>` },
      { t: "Breakages", d: `<p>We understand that sometimes accidents happen! Should you break anything please let us know immediately - if it's minor we usually won't charge. If it's a larger issue (e.g. the TV screen) we would like to agree on the cost to replace with you before you leave to avoid any issues later. Thank you, we appreciate your cooperation. 🙏🏽</p>` },
      { t: "Smoking Policy", d: `<p><strong>This is a smoke-free property</strong>, unless you are on the outside surrounding property and not near open windows. No smoking of any substance, including vaping, is permitted inside the home. 🚭</p>` },
      { t: "Pets", d: `<p>We love animals. ❤️🐶</p><p>We chose to allow well-behaved woof woofs to our home, but we ask that you please control your furry friends while visiting. Any messes made, please clean up. 💩🗑 Pick up after your pet. Keep the animal kenneled please if you leave them alone. And please adhere to the same quiet rules as humans to allow other guests and full-time residents in the area the opportunity for peace and quiet. </p>` },
      { t: "What to do in an Emergency", d: `<p>For emergency services (ambulance, police, fire) please immediately call <strong>911</strong>. ☎️</p><p>Do not delay if you feel an emergency situation has arisen. State your location as the address at the top of this guide. <br/><br/><strong>In case of a fire 🔥</strong></p><ul><li>Exit the property as quickly as possible</li><li>Ensure that all persons are accounted for</li><li>Dial 911 and ask for ‘FIRE’ 👩🏼‍🚒</li><li>State your location (see the top of this guide)</li></ul><p>Do not attempt to re-enter the property until a Fire Officer states that it is safe to do so.</p>` },
      { t: "Emergency Phone Numbers", d: `<p>For emergency services please immediately call <strong>911</strong>. Do not delay if you feel an emergency situation has arisen.</p><p>If another emergency that doesn't threaten human life occurs, but threatens property damage (like water pipes broken, locks broker, etc), please contact Alison and Jason through the VRBO or Airbnb app you booked through. </p><p>If we do not respond within minutes, please call our contractor and handyman Vince Romero at 480-358-8278, <strong><em><u>ONLY during absolute emergencies</u></em></strong> and <strong><em>only if</em><em> </em></strong>we do not respond to you quickly and you are concerned about property damage. </p>` }
    ]},

      { t: "WiFi / Internet Details", d: `<p>There is free Wi-Fi for your use. The details are: <br><br>ID: <strong>Desert Buena Vida</strong><br>Password: <strong>Oasiscactus</strong><br><br>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us.</p>` }
    ]},
    { title: "👋 So Long, Farewell!", topics: [
      { t: "Thank You For Staying With Us", d: `<p><strong>Thank you for staying with us, and we hope you enjoyed your stay. 😇</strong> If there were any issues with your stay, please don't hesitate to tell us, as we want to ensure we can resolve them for the next guest. <br/><br/><strong>We love online reviews!</strong> <br/><br/>VRBO and Airbnb auto sends you a review request. All you need to do is click the "leave a review" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. <br/><br/>Was it the comfy bed? The information and recommendations? Or maybe it was Keurig machine in the kitchen? ⭐️⭐️⭐️⭐️⭐️<br/><br/>If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <br/><br/><strong>With sincere gratitude,</strong> <br/>❤️ Alison &amp; Jason </p>` },
      { t: "Check-out Time", d: `<p>Check-out time is strictly 11 AM. Should you require a later check-out we will do our best but you need to let us know beforehand. If we have guests arriving the same day <em>(which is typical)</em> it will be almost impossible to offer a late check-out due to the cleaners needing to prepare for those guests. <em>We appreciate your understanding in advance</em>. </p>` },
      { t: "Check-out Process", d: `<p>Before your departure, we would appreciate if you would take care of the following:</p><ul><li>Leave the beds unmade. No need to strip them.</li><li>Place used towels in the shower.</li><li>Load the dishwasher and start it (please).</li><li>Empty all the trash and place in trash bin outside.</li><li>Move all furniture and items back to original locations.</li><li>Set thermostat to 75F / 24C.</li><li>Check all doors and windows to be sure that they are locked.</li></ul><p>We hope you had a wonderful stay and wish you safe travels back home!</p>` }
    ]}
