  moments: {"Pre-arrival": {"tagline": "Let's get you ready for Sevierville!", "topics": ["Welcome", "Add This Guide To Your Phone", "Driving Directions", "Things To Bring", "Overview of the Area", "Contacting Us"]}, "Check-in": {"tagline": "Welcome! Here's how to get settled.", "topics": ["Access Codes / Instructions", "Check-in Time", "Suggestions if you Arrive Early", "WiFi / Internet Details", "Heating & Cooling", "Quiet Times", "What to do in an Emergency"]}, "During your stay": {"tagline": "Make the most of your stay.", "topics": ["WiFi / Internet Details", "Hot Tub / Jacuzzi", "Swimming Pool", "Fireplace", "Television", "Grill / BBQ", "Lions, Tigers, & Bears, OH MY!", "Emergency phone numbers"]}, "Check-out": {"tagline": "Everything for an easy check-out.", "topics": ["Check-out Time", "Check-out Process", "Thank You For Staying With Us"]}},

  sections: [
    { title: "👋 Welcome", topics: [
      { t: "Welcome", d: `<p><strong>Welcome: Your Inside Track</strong></p><p>This is your time. And your time is precious. That's why we've created this guidebook. You'll find everything you need to know about staying with us, from check-in time to the WiFi code, great coffee to the best local restaurants. It's all here.</p><p><strong>Do I really need this info?</strong> Honest answer? 100% YES! Think of it like having us "virtually" by your side, showing you:</p><ul><li>How to find us 📍</li><li>The WiFi code 📶</li><li>Check-in instructions 🔑</li><li>Discovering wonderful local places 🎢</li><li>Excellent restaurants 🍽</li><li>How to find eternal happiness 🥰</li></ul><p>Well maybe not that last one, but hopefully you will leave us relaxed, content, and rejuvenated!</p><p>If you'd like a PDF of this guide, tap <strong>🖨 Print</strong> at the top and choose "Save as PDF".</p><p><strong>What next?</strong> Please relax, unwind, have fun, and enjoy your stay!</p>` }
    ]},
    { title: "🧳 Before You Leave Home", topics: [
      { t: "Add This Guide To Your Phone", d: `<p>Add this guide to your home screen so it opens like an app 📲, no download or sign-in needed.</p><ul><li><strong>iPhone:</strong> open this link in Safari, tap the Share button, then "Add to Home Screen".</li><li><strong>Android:</strong> open in Chrome, tap the ⋮ menu, then "Add to Home screen".</li></ul><p><strong>Share your guide with your group.</strong> Send this link to everyone travelling with you so everyone has the info (less hassle for the trip organizer!).</p>` },
      { t: "Driving Directions", d: `<p>Tap <strong>Get directions</strong> on the Home tab. It opens Google Maps with the house already filled in as your destination. 📍</p>` },
      { t: "Things To Bring", d: `<p>Here's a basic list of what you might want to bring on your vacation. You'll no doubt have your own needs, but we thought this might be helpful, knowing what we do about the amenities in this home!</p><ul><li>Personal toiletries 🪥</li><li>Camera, memory cards, charger 📸</li><li>Personal electronics chargers 🔌</li><li>Flashlights, batteries 🔦🔋</li><li>Hiking gear 🥾</li><li>Sunscreen, and depending on the time of year, perhaps an umbrella ☂️</li></ul>` }
    ]},
    { title: "🔑 Arrival Information", topics: [
      { t: "Access Codes / Instructions", d: `<p>We will provide you with an access key code 24 hours prior to arrival for our keyless 🚫🔑door lock. This will allow you to check yourself in to the property. <strong>Please ensure you have the code before you travel. If not, please contact us.</strong> There's nothing worse than arriving somewhere new (potentially at night) and not being able to get in!</p><p>To operate the keyless lock, simply activate the keypad by pressing the HOME/CHECKMARK Icon on the lower left of the keypad. The keypad should now light up. Press your four digit password and press the HOME/CHECKMARK ☑️ button again to open. </p><p>To lock, simply press the LOCK 🔒icon/button. </p>` },
      { t: "Check-in Time", d: `<p>Check-in time is 4️⃣PM. If you are arriving early, have a look at the Local guide tab. We've listed lots of things to do around the area - it's time for you to kick back and start relaxing!</p>` },
      { t: "Contacting Us", d: `<p>If you booked on <a href="https://www.airbnb.com" target="_blank" rel="noopener">Airbnb</a> or <a href="https://www.vrbo.com" target="_blank" rel="noopener">VRBO</a>, we prefer all communication goes through their app. If you booked directly with us, please phone, text or email:</p><ul><li><a href="sms:4807803512">Text us at (480) 780-3512</a> 💬 (fastest: Alison, Jason and our assistant all see it)</li><li><a href="tel:6024325367">Call (602) 432-5367</a> ☎️</li><li><a href="mailto:MyVacation@WanderOver.com">Email MyVacation@WanderOver.com</a> 📧</li></ul>` },
      { t: "Overview of the Area", d: `<p>You will be staying in Sevierville, nearly bordering Pigeon Forge, about 7 miles away. </p><p>✈️ Knoxville airport is 40 mi away (1 hour 3 minutes) </p><p>🍎 Old Mountain Market is located 5.6 mi away (10 minutes) </p><p>🛒 Kroger is 4.8 mi (12 minutes)</p><p>⛽️ Gas Stations 1.2 mi (4 minutes) </p><p>🏔 Rocky Top Mountain Coaster is 7.1 mi (14 minutes)</p><p>🎡 The Island in Pigeon Forge is 7.6 mi (17 minutes) </p><p>🎢 Dollywood is 8.4 mi (16 minutes) </p><p>🐻 Smoky Mountain Nat'l Park is 12 mi (34 minutes) </p><p>🌳 Downtown Gatlinburg is 12 mi (25 minutes)</p>` },
      { t: "Suggestions if you Arrive Early", d: `<p>Many guests will arrive before the designated check-in time. The good news is that there is plenty to do. We often suggest that guests visit the general store (Old Mountain Market in Pigeon Forge) or visit some small shops (like Alewine Pottery, Apple Annies, or Misty Mountain Soup, all on Glade Rd amount dozens of cool local shops). That will give you more time to relax once you've checked in! There are also a few good restaurants for lunch so why not relax and enjoy some of the local food!</p>` }
    ]},
    { title: "🏡 About the Accommodation", topics: [
      { t: "Kitchen Equipment", d: `<p>The Dishwasher: It's very simple, we promise! We provide a supply of tablets - you will need to insert one into the flip box container on the inside of the dishwasher door. Then press the program button of your choice - there are a few settings which are obvious - then press the start button. <br/><br/>The Fridge/freezer: You should not need to adjust any settings. If you run into any difficulties (e.g. it's not cooling efficiently) please let us know. <br/><br/>The Oven/Range: No special instructions, please know that all appliances operate with electricity, there is no gas to the property.  </p>` },
      { t: "Heating & Cooling", d: `<p>You will find a panel on the living room wall that allows you to control the temperature of the home, as well as one in the downstairs theatre room. If you're running the air conditioning, please ensure that all windows and outside doors are closed to ensure it operate to maximum efficiency. We recommend a setting of 72F / 22C which we find keeps the place at a comfortable temperature. IF you adjust up or down, <em>PLEASE</em> only adjust a max of 3 degrees at a time as to not damage the equipment. </p>` },
      { t: "Laundry Appliances", d: `<p>We have a washer and separate dryer located in the utility closet downstairs in the theatre room. There is a supply of detergent for your use. To operate the machines, simply select the program you want, place the detergent in the tray, close the door, and hit start. If in any doubt there are instructions next to the machines.</p>` },
      { t: "Fireplace", d: `<p>Our home has a working electric fireplace. Please take extra care when using the fireplace. The fireplace is more for ambience than heat, as we do have central heating in the property for your ultimate comfort. </p>` },
      { t: "Television", d: `<p>There is a television available in each bedrooms, as well as the living room and theatre room downstairs. If you'd like to watch popular streaming apps like Netflix or Hulu, simply log into the app you'd prefer, sign into the streaming service and enjoy. Remember to sign out of your streaming services before you conclude your stay. </p><p>The only exception is the theatre room remote. There is a large remote docked in a charger beneath the screen on the wall. Instructions for use of this system are detailed on two laminated sheets in the theatre room. Please use these, and leave these, on the table. <em>Until you get the hang of it,</em> we suggest moving <strong><em>slow</em></strong> at first, carefully reading the instructions of how to use the remove/DVD player. </p>` },
      { t: "Swimming Pool", d: `<p>We have a community swimming pool available for your use only (typically) between Memorial Day and Labor Day. It may be open sooner, or later, at the HOA's discretion, and could be closed due to weather, repairs, or season. <em>Please also pay special attention to the safety rules which are located at the pool. </em></p><p>Coco's Cantina is located at the pool, and typically operates from April to October, hours vary. </p><p>***Pool code to get in is 8121. </p>` },
      { t: "Hot Tub / Jacuzzi", d: `<p>We have an outdoor hot tub available for your use. We have our hot tub drained and sanitized by our cleaning staff between each guest stay for your safety, therefore please know that the hot tub <em>may be</em> cool upon your arrival as it does take a few hours to heat to the optimal temperature.  <br/><br/>Please also pay special attention to the safety rules which are located next to the hot tub posted on the wall. </p>` },
      { t: "Grill / BBQ", d: `<p>There is an outdoor grill available for your use. They require charcoal to use, if important to you, please make sure to pick up a small bag from the local grocery store as we do not keep charcoal on hand. Please ensure you leave it clean to avoid any additional cleaning fees. We have an ash bucket located close to the grills for your convenience. </p>` }
    ]},
    { title: "📋 Safety Info & Rules", topics: [
      { t: "Quiet Times", d: `<p>We are located in a residential community and, although this is a vacation destination, it's home to many people. As such we ask that you respect their privacy and their right to a peaceful existence. Specifically, between the hours of 10pm and 7am noise should be kept to a minimum. 🤫</p>` },
      { t: "Breakages", d: `<p>We understand that sometimes accidents happen! Should you break anything please let us know immediately - if it's minor we usually won't charge. If it's a larger issue (e.g. the TV screen) we would like to agree on the cost to replace with you before you leave to avoid any issues later. Thank you, we appreciate your cooperation. 🙏🏽</p>` },
      { t: "Smoking Policy", d: `<p><strong>This is a smoke-free property</strong>, unless you are on the outside surrounding property and not near open windows. No smoking of any substance, including vaping, is permitted inside the home. 🚭</p>` },
      { t: "Pets", d: `<p>We love animals. ❤️🐶</p><p>We chose to allow well-behaved woof woofs to our cabin, but we ask that you please control your furry friends while visiting. Any messes made, please clean up. 💩🗑 Pick up after your pet. Keep the animal kenneled please if you leave them alone. And please adhere to the same quiet rules as humans to allow other guests and full time residents in the area the opportunity for peace and quiet. </p>` },
      { t: "Lions, Tigers, & Bears, OH MY!", d: `<p>Seriously, the Smoky Mountains are home to primarily Black Bears, but other bears too. It's NOT uncommon to see a bear in the neighborhood. PLEASE do not feed them, nor approach or harass them in any way. Steer clear for your safety and theirs! </p><p>We have a Bear Bin outside of the front porch to put trash, please keep ALL trash inside to keep bears from considering wandering onto the porch. <strong><em>Bear bins MUST BE LOCKED at all times. </em></strong></p>` },
      { t: "What to do in an Emergency", d: `<p>For emergency services (ambulance, police, fire) please immediately call <strong>911</strong>. ☎️</p><p>Do not delay if you feel an emergency situation has arisen. State your location (2707 Misty Blue Mountain Dr Lot 13 Sevierville, TN 37876).  <br/><br/><strong>In case of a fire 🔥</strong></p><ul><li>Exit the property as quickly as possible</li><li>Ensure that all persons are accounted for</li><li>Dial 911 and ask for ‘FIRE’ 👩🏼‍🚒</li><li>State your location (2707 Misty Blue Mountain Dr Lot 13 Sevierville, TN 37876).</li></ul><p>Do not attempt to re-enter the building until a Fire Officer states that it is safe to do so.</p>` },
      { t: "Emergency phone numbers", d: `<p>For emergency services please immediately call <strong>911</strong>. Do not delay if you feel an emergency situation has arisen.</p><p>If another emergency that doesn't threaten human life occurs, but threatens property damage (like water pipes broken, locks broker, etc), please contact Alison and Jason through the VRBO or Airbnb app you booked through. </p><p>If we do not respond within minutes, please call our contractor and handyman Troy Binger at 865-722-1037, <strong><em><u>ONLY during absolute emergencies</u></em></strong> and <strong><em>only if</em><em> </em></strong>we do not respond to you quickly and you are concerned about property damage. </p>` }
    ]},
    { title: "📶 WiFi / Internet Details", topics: [
      { t: "WiFi / Internet Details", d: `<p>There is free Wi-Fi for your use. The details are: <br/><br/>ID: <strong>WanderOver.com</strong></p><p>Password: <strong>MyVacation@</strong></p><p>The service is provided for your enjoyment but you are responsible for safe and appropriate use and complying with all laws. If there is any loss of service please contact us and we'll contact the provider, Xfinity, to request help.</p>` }
    ]},
    { title: "👋 So Long, Farewell!", topics: [
      { t: "Thank You For Staying With Us", d: `<p><strong>Thank you for staying with us, and we hope you enjoyed your stay. 😇</strong> If there were any issues with your stay, please don't hesitate to tell us, as we want to ensure we can resolve them for the next guest. <br/><br/><strong>We love online reviews!</strong> <br/><br/>VRBO and Airbnb auto sends you a review request. All you need to do is click the "leave a review" button, give us a star rating, and write a sentence or two about what you liked the best during your stay. <br/><br/>Was it the comfy bed? The information and recommendations? Or maybe it was Keurig machine in the kitchen? ⭐️⭐️⭐️⭐️⭐️<br/><br/>If you are unable to leave us 5 stars, please don't hesitate to contact us first to let us know why - you are key to helping our next guests to have a wonderful time. <br/><br/><strong>With sincere gratitude,</strong> <br/>❤️ Alison &amp; Jason </p>` },
      { t: "Check-out Time", d: `<p>Check-out time is strictly 🔟AM. Should you require a later check-out we will do our best but you need to let us know beforehand. If we have guests arriving same day <em>(which is typical)</em> it will be almost impossible to offer a late check-out due to the cleaners needing to prepare for those guests. <em>We appreciate your understanding this in advance</em>. </p>` },
      { t: "Check-out Process", d: `<p>Before your departure, we would appreciate if you would take care of the following:</p><ul><li>Leave the beds unmade. No need to strip them.</li><li>Place used towels in the shower.</li><li>Load the dishwasher and start it.</li><li>Empty all the trash and place in bear bin outside and <em><strong>LOCK</strong> the bin</em>.</li><li>Move all furniture and items back to original locations.</li><li>Set thermostat to 75F / 24C.</li><li>Check all doors and windows to be sure that they are locked.</li></ul><p>We hope you had a wonderful stay and wish you safe travels back home!</p>` }
    ]}
  ],
