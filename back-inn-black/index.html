    </div>

    </div>
    <div class="card quick">

    </div>

  <section class="view" id="view-info">
    <input type="search" id="search" placeholder="Search for anything… (wifi, grill, pets)">
    <div id="info"></div>
  </section>

  <!-- MAP -->
  <section class="view" id="view-map">
    <div id="map"></div>
    <div class="filters" id="filters"></div>
    <ul class="places" id="places"></ul>
  </section>
</main>

      { t: "Welcome", d: `<p><strong>Welcome: Your Inside Track</strong></p><p>This is your time. And your time is precious. That's why we've created this guidebook. You'll find everything you need to know about staying with us, from check-in time to the WiFi code, great coffee to the best local restaurants. It's all here.</p><p><strong>Do I really need this info?</strong> Honest answer? 100% YES! Think of it like having us "virtually" by your side, showing you:</p><ul><li>How to find us 📍</li><li>The WiFi code 📶</li><li>Check-in instructions 🔑</li><li>Discovering wonderful local places 🎢</li><li>Excellent restaurants 🍽</li><li>How to find eternal happiness 🥰</li></ul><p>Well maybe not that last one, but hopefully you will leave us relaxed, content, and rejuvenated!</p><p>If you'd like a PDF of this guide, tap <strong>🖨 Print</strong> at the top and choose "Save as PDF".</p><p><strong>What next?</strong> Please relax, unwind, have fun, and enjoy your stay!</p>` }
